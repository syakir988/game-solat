<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Susunan Rukun Solat — Halaman Utama</title>
    <!-- Font dependencies removed so this edition also runs offline as a single HTML file. -->
    <style>
      :root {
          --primary: #2D9596;
          --primary-dark: #1F6B6C;
          --secondary: #D4AF37;
          --secondary-dark: #A8861B;
          --bg: #F5F5DC;
          --bg-card: rgba(255, 255, 255, 0.94);
          --accent: #9B7EBD;
          --success: #2E7D32;
          --success-glow: rgba(46, 125, 50, 0.55);
          --error: #D32F2F;
          --error-glow: rgba(211, 47, 47, 0.5);
          --warning: #E65100;
          --text-main: #232B2B;
          --transition-fast: 150ms cubic-bezier(0, 0, 0.2, 1);
          --transition-normal: 250ms cubic-bezier(0, 0, 0.2, 1);
      }

      * {
          box-sizing: border-box;
      }

      body, html {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: "Segoe UI", Arial, sans-serif;
          background: var(--bg);
          color: var(--text-main);
          -webkit-text-size-adjust: 100%;
      }

      #game-world {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          max-height: 100%;
          overflow-y: scroll !important;
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
          touch-action: pan-y;
          overscroll-behavior-y: contain;
          background-color: var(--bg);
          background-repeat: repeat;
          background-size: 360px auto;
          display: flex;
          flex-direction: column;
          user-select: none;
          -webkit-user-select: none;
      }

      .pattern-overlay {
          position: fixed;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(circle at 50% 25%, rgba(255,255,255,0.72) 0%, rgba(245,245,220,0.88) 100%);
          z-index: 0;
      }

      /* Centered Game Container & Layout */
      .game-container {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: 920px;
          margin: 0 auto;
          min-height: min-content;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: flex-start;
          padding: 10px 8px 60px;
          overflow: visible;
      }

      /* Keep the title at the top while the puzzle expands naturally on larger screens. */
      .gameplay-area {
          width: 100%;
          max-width: 900px;
          display: flex;
          flex-direction: column;
          margin: 8px auto 0;
          flex: 1 0 auto;
      }

      /* Homepage styles live in <style id="solat-home-styles"> (Home Page module). */
      /* Header & Timer */
      .header-area {
          text-align: center;
          padding: 6px 12px 4px;
          flex-shrink: 0;
          width: 100%;
      }

      .header-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          margin-bottom: 2px;
      }

      .game-title {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 24px;
          font-weight: 700;
          color: var(--primary-dark);
          margin: 0;
          display: flex;
          align-items: center;
          gap: 6px;
          text-shadow: 0 1px 2px rgba(0,0,0,0.06);
      }

      .timer-badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 5px 12px;
          border-radius: 20px;
          background: #E8F5E9;
          border: 2px solid #2E7D32;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 17px;
          font-weight: 700;
          color: #1B5E20;
          box-shadow: 0 2px 8px rgba(46, 125, 50, 0.2);
          transition: all var(--transition-normal);
      }

      .timer-badge.normal {
          border-color: #2E7D32;
          color: #1B5E20;
          background: #E8F5E9;
          box-shadow: 0 2px 8px rgba(46, 125, 50, 0.25);
      }

      .timer-badge.warning {
          border-color: #FFA000;
          color: #E65100;
          background: #FFF8E1;
          box-shadow: 0 2px 10px rgba(255, 160, 0, 0.35);
      }

      .timer-badge.danger {
          border-color: var(--error);
          color: var(--error);
          background: #FFEBEE;
          box-shadow: 0 0 14px rgba(211, 47, 47, 0.6);
          animation: pulseDanger 0.8s infinite alternate;
      }

      @keyframes pulseDanger {
          from { transform: scale(1); }
          to { transform: scale(1.05); }
      }

      .header-subtitle {
          font-size: 13px;
          font-weight: 500;
          color: #555;
          margin: 0;
      }

      /* Result Banner */
      .result-banner {
          margin: 2px 12px 4px;
          padding: 6px 12px;
          border-radius: 10px;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 13.5px;
          font-weight: 600;
          text-align: center;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.06);
          animation: bannerSlideIn 0.25s ease;
      }

      @keyframes bannerSlideIn {
          from { opacity: 0; transform: translateY(-6px); }
          to { opacity: 1; transform: translateY(0); }
      }

      .result-banner.success {
          background: #E8F5E9;
          color: var(--success);
          border: 2px solid #81C784;
      }

      .result-banner.partial {
          background: #FFF8E1;
          color: #B78103;
          border: 2px solid #FFE082;
      }

      .result-banner.empty {
          background: #ECEFF1;
          color: #546E7A;
          border: 2px solid #CFD8DC;
      }

      /* Slots Area */
      .slots-area {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          padding: 5px 3px;
          width: 100%;
          max-width: 900px;
          margin: 8px auto 0;
          align-self: center;
          flex-shrink: 0;
      }

      .slot {
          width: 100%;
          min-height: 62px;
          height: 64px;
          border: 2px dashed rgba(45, 149, 150, 0.45);
          border-radius: 13px;
          display: flex;
          align-items: center;
          background: var(--bg-card);
          position: relative;
          padding: 0 10px;
          box-shadow: 0 2px 5px rgba(0,0,0,0.06);
          transition: all var(--transition-fast);
      }

      .slot.slot-centered-last {
          grid-column: span 2;
          max-width: 350px;
          margin-inline: auto;
      }

      .slot.drag-over {
          border-color: var(--secondary);
          background: rgba(212, 175, 55, 0.22);
          transform: scale(1.015);
          box-shadow: 0 3px 10px rgba(212, 175, 55, 0.3);
      }

      .slot.filled {
          border-style: solid;
          border-color: rgba(45, 149, 150, 0.7);
          background: #FFFFFF;
          cursor: grab;
      }

      /* Smooth snap-in animation for slotted posture */
      @keyframes snapIn {
          0% {
              transform: scale(0.88);
              opacity: 0.75;
          }
          55% {
              transform: scale(1.03);
          }
          100% {
              transform: scale(1);
              opacity: 1;
          }
      }

      .slot.just-snapped {
          animation: snapIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      /* Green glow animation for correct posture */
      @keyframes greenGlow {
          0% {
              box-shadow: 0 0 4px var(--success-glow);
              border-color: #2E7D32;
          }
          50% {
              box-shadow: 0 0 14px rgba(46, 125, 50, 0.85);
              border-color: #1B5E20;
          }
          100% {
              box-shadow: 0 0 5px var(--success-glow);
              border-color: #2E7D32;
          }
      }

      /* Red flash & shake animation for wrong posture */
      @keyframes redFlash {
          0% {
              box-shadow: 0 0 3px var(--error-glow);
              border-color: #D32F2F;
              transform: translateX(0);
          }
          20% {
              box-shadow: 0 0 16px rgba(211, 47, 47, 0.9);
              border-color: #B71C1C;
              transform: translateX(-4px);
          }
          40% {
              box-shadow: 0 0 16px rgba(211, 47, 47, 0.9);
              border-color: #D32F2F;
              transform: translateX(4px);
          }
          60% {
              box-shadow: 0 0 12px rgba(211, 47, 47, 0.7);
              border-color: #D32F2F;
              transform: translateX(-3px);
          }
          80% {
              box-shadow: 0 0 8px rgba(211, 47, 47, 0.6);
              border-color: #D32F2F;
              transform: translateX(2px);
          }
          100% {
              box-shadow: 0 0 4px var(--error-glow);
              border-color: #D32F2F;
              transform: translateX(0);
          }
      }

      .slot.result-correct {
          border-color: var(--success) !important;
          background: #F1F8E9 !important;
          animation: greenGlow 1.4s infinite alternate ease-in-out;
      }

      .slot.result-wrong {
          border-color: var(--error) !important;
          background: #FFEBEE !important;
          animation: redFlash 0.5s ease-in-out;
      }

      .slot-number {
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background: var(--primary);
          color: white;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 15px;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          box-shadow: 0 1.5px 3px rgba(45,149,150,0.3);
      }

      .slot.result-correct .slot-number {
          background: var(--success);
      }

      .slot.result-wrong .slot-number {
          background: var(--error);
      }

      .slot-empty-label {
          display: flex;
          flex-direction: column;
          margin-left: 10px;
          flex: 1;
          min-width: 0;
      }

      .slot-empty-main {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 14px;
          color: #666;
          font-weight: 600;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }

      .slot-hint-text {
          font-size: 11.5px;
          color: #2D9596;
          font-weight: 500;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }

      .slot-content {
          display: flex;
          align-items: center;
          margin-left: 8px;
          gap: 8px;
          flex: 1;
          min-width: 0;
      }

      .slot-art-thumb {
          width: 42px;
          height: 42px;
          border-radius: 9px;
          background: #E6F4F1;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
          border: 1px solid rgba(45, 149, 150, 0.2);
          overflow: hidden;
      }

      .slot-art-thumb img,
      .slot-art-thumb svg {
          width: 34px;
          height: 34px;
          object-fit: contain;
          pointer-events: none;
      }

      .slot-text-group {
          display: flex;
          flex-direction: column;
          justify-content: center;
          min-width: 0;
          flex: 1;
      }

      .slot-icon-label {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 14px;
          font-weight: 600;
          color: #222;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          line-height: 1.15;
      }

      .slot-icon-desc {
          font-size: 11.5px;
          color: #666;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          line-height: 1.15;
      }

      .slot-status-badge {
          margin-left: auto;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 22px;
          height: 22px;
          border-radius: 50%;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 12px;
          font-weight: 700;
          flex-shrink: 0;
      }

      .slot-status-badge.correct {
          background: #C8E6C9;
          color: #1B5E20;
      }

      .slot-status-badge.wrong {
          background: #FFCDD2;
          color: #B71C1C;
      }

      /* Action Buttons */
      .actions-bar {
          display: flex;
          justify-content: center;
          gap: 12px;
          padding: 10px 8px 4px;
          flex-shrink: 0;
          width: 100%;
          max-width: 900px;
      }

      .btn {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 14px;
          font-weight: 600;
          padding: 8px 14px;
          border-radius: 11px;
          border: none;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          transition: all var(--transition-fast);
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          -webkit-tap-highlight-color: transparent;
      }

      .btn:active {
          transform: scale(0.96);
      }

      .btn-primary {
          background: var(--primary);
          color: white;
      }

      .btn-primary:hover {
          background: var(--primary-dark);
      }

      .btn-primary.btn-ready {
          background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
          box-shadow: 0 4px 14px rgba(46, 125, 50, 0.45);
          animation: pulseReady 1.2s infinite alternate ease-in-out;
      }

      @keyframes pulseReady {
          from { transform: scale(1); }
          to { transform: scale(1.03); }
      }

      .btn-secondary {
          background: #FFFFFF;
          color: var(--primary-dark);
          border: 2px solid var(--primary);
      }

      .btn-secondary:hover {
          background: #F0F9F8;
      }

      .btn-accent {
          background: var(--secondary);
          color: #332700;
      }

      .btn-danger {
          background: var(--error);
          color: white;
      }

      /* Tray (Kad Pembayang) - Elegant Islamic Emerald & Gold Theme */
      .tray-area {
          padding: 11px 12px 12px;
          background: linear-gradient(150deg, #133334 0%, #0c2324 100%);
          border: 2px solid #C5A059;
          border-radius: 18px;
          flex-shrink: 0;
          width: 100%;
          max-width: 900px;
          margin-top: 10px;
          box-shadow: 0 8px 24px rgba(12, 35, 36, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .tray-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 9px;
          padding: 0 4px;
      }

      .tray-label {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 15.5px;
          color: #F3E5AB;
          font-weight: 700;
          letter-spacing: 0.3px;
          display: flex;
          align-items: center;
          gap: 6px;
      }

      .tray-count {
          font-size: 12.5px;
          color: #D4AF37;
          font-weight: 600;
          background: rgba(212, 175, 55, 0.15);
          padding: 3px 10px;
          border-radius: 12px;
          border: 1px solid rgba(212, 175, 55, 0.3);
      }

      .tray {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
          gap: 8px;
          width: 100%;
          padding: 3px 1px 5px;
      }

      .tray-empty-hint {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          grid-column: 1 / -1;
          height: 52px;
          color: #F3E5AB;
          background: rgba(255, 255, 255, 0.08);
          border: 1px dashed rgba(212, 175, 55, 0.5);
          border-radius: 10px;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 13.5px;
          font-weight: 600;
          text-align: center;
          padding: 0 10px;
      }

      .posture-icon {
          width: 100%;
          height: 72px;
          min-width: 0;
          background: linear-gradient(135deg, #1E4647 0%, #153536 100%);
          border: 1.5px solid rgba(212, 175, 55, 0.65);
          border-radius: 13px;
          display: flex;
          align-items: center;
          justify-content: flex-start;
          gap: 9px;
          padding: 7px 9px;
          cursor: grab;
          transition: all var(--transition-fast);
          box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
          position: relative;
          z-index: 1;
      }

      .posture-icon:active {
          cursor: grabbing;
      }

      /* Allow a normal vertical swipe over cards on phones. A brief hold starts dragging. */
      .posture-icon,
      .slot.filled {
          touch-action: pan-y;
          -ms-touch-action: pan-y;
          -webkit-user-drag: none;
      }

      .posture-icon:hover {
          transform: translateY(-2px) scale(1.02);
          box-shadow: 0 6px 16px rgba(212, 175, 55, 0.38);
          border-color: #F3E5AB;
          background: linear-gradient(135deg, #245253 0%, #193e3f 100%);
      }

      .posture-icon.dragging {
          opacity: 0.35;
          transform: scale(0.9);
      }

      .posture-art-wrap {
          width: 44px;
          height: 44px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #FFFFFF;
          border: 1.5px solid #D4AF37;
          border-radius: 8px;
          overflow: hidden;
          flex-shrink: 0;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.18);
      }

      .posture-art-wrap img,
      .posture-art-wrap svg {
          width: 36px;
          height: 36px;
          object-fit: contain;
          pointer-events: none;
      }

      .posture-icon .icon-label {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 13.5px;
          font-weight: 600;
          color: #F8F9FA;
          text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
          text-align: left;
          line-height: 1.22;
          white-space: normal;
          overflow: hidden;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          width: 100%;
      }

      /* A temporary, focused clue appears for a few seconds when requested. */
      .quick-hint-panel {
          margin: 4px 12px 3px;
          padding: 8px 14px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          background: linear-gradient(135deg, #FFFDF6 0%, #FFF5D6 100%);
          color: #4A3A08;
          border: 2px solid #D4AF37;
          box-shadow: 0 3px 10px rgba(180, 140, 20, 0.18);
          font-size: 13px;
          font-weight: 600;
          text-align: center;
          animation: bannerSlideIn 0.2s ease;
      }

      .quick-hint-panel strong {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          color: #A8861B;
      }

      .starter-hint-banner {
          margin: 2px 12px 6px;
          padding: 7px 12px;
          border-radius: 10px;
          font-family: "Segoe UI", Arial, sans-serif;
          font-size: 12.5px;
          font-weight: 600;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          background: #E8F5E9;
          color: #1B5E20;
          border: 1.5px solid #A5D6A7;
          box-shadow: 0 1.5px 5px rgba(46, 125, 50, 0.1);
      }

      .drag-preview {
          position: fixed;
          pointer-events: none;
          z-index: 3000;
          opacity: 0.96;
          transform: translate(-50%, -50%) scale(1.08);
          transition: none;
          box-shadow: 0 10px 24px rgba(0,0,0,0.4);
          border-color: #D4AF37 !important;
          background: #193e3f !important;
          width: 150px !important;
      }
      .drag-preview .icon-label {
          color: #FFFFFF !important;
      }

      /* Overlay Modals (Answers, Victory, Game Over) */
      .modal-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.65);
          backdrop-filter: blur(4px);
          z-index: 2000;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 20px;
          animation: fadeIn 0.2s ease;
      }

      .modal-card {
          background: white;
          border-radius: 20px;
          width: 100%;
          max-width: 520px;
          max-height: 90vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
          box-shadow: 0 14px 40px rgba(0,0,0,0.32);
          border: 3px solid var(--primary);
      }

      .modal-header {
          background: var(--primary);
          color: white;
          padding: 14px 18px;
          display: flex;
          align-items: center;
          justify-content: space-between;
      }

      .modal-header h2 {
          margin: 0;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 22px;
      }

      .modal-close-btn {
          background: rgba(255,255,255,0.2);
          border: none;
          color: white;
          font-size: 22px;
          font-weight: bold;
          width: 34px;
          height: 34px;
          border-radius: 50%;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .modal-body {
          padding: 14px 18px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      .answer-row {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 7px 10px;
          border-radius: 12px;
          background: #F7FAF9;
          border: 1px solid #E0ECE9;
      }

      .answer-num {
          width: 30px;
          height: 30px;
          border-radius: 50%;
          background: var(--primary);
          color: white;
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-weight: 700;
          font-size: 15px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
      }

      .answer-thumb {
          width: 40px;
          height: 40px;
          background: #E6F4F1;
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
      }

      .answer-thumb img {
          width: 36px;
          height: 36px;
          object-fit: contain;
      }

      .answer-info {
          display: flex;
          flex-direction: column;
      }

      .answer-title {
          font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
          font-size: 15px;
          font-weight: 600;

    <script>
      /*
       * ===================== HALAMAN UTAMA (index.html) =====================
       * Fail 1 daripada 3:  index.html  →  susunan-rukun.html  /  kuiz.html
       */
      /* ---- Bahasa & navigasi antara halaman (dikongsi oleh ketiga-tiga fail) ---- */
      const SOLAT_PAGES = {
        home: 'index.html',
        puzzle: 'game.html',
        quiz: 'quiz.html',
      };

      function getInitialLang() {
        try {
          const q = new URLSearchParams(window.location.search).get('lang');
          if (q === 'en' || q === 'ms') return q;
        } catch (e) {}
        try {
          const s = window.localStorage.getItem('solat-lang');
          if (s === 'en' || s === 'ms') return s;
        } catch (e) {}
        return 'ms';
      }

      function saveLang(code) {
        try {
          window.localStorage.setItem('solat-lang', code);
        } catch (e) {}
      }

      let currentLang = getInitialLang(); // 'ms' | 'en'
      try {
        document.documentElement.lang = currentLang;
      } catch (e) {}

      function pageUrl(page) {
        return SOLAT_PAGES[page] + '?lang=' + encodeURIComponent(currentLang);
      }

      function goTo(page, delay) {
        // Jeda pendek supaya bunyi klik sempat kedengaran sebelum halaman bertukar.
        setTimeout(() => {
          window.location.href = pageUrl(page);
        }, delay || 0);
      }

      let audioCtx = null;
      const audioBuffers = new Map();
      const CACHED_ASSET_URLS = {};

      // Create or resume AudioContext
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      // Unlock AudioContext secara menyeluruh untuk semua peranti (iOS, Android, Desktop)
      function unlockAudio() {
        const ctx = getAudioContext();
        if (ctx) {
          if (ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          try {
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
          } catch (e) {}
        }
      }

      ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach((evt) => {
        window.addEventListener(evt, unlockAudio, { passive: true });
      });

      // Sandaran main audio melalui elemen HTML5 Audio
      function playHtmlAudio(assetId, vol = 0.8) {
        try {
          const asset = getAssetInfo(assetId);
          if (asset && asset.url) {
            const audio = new Audio();
            audio.src = asset.url;
            audio.volume = Math.max(0, Math.min(1, vol));
            const p = audio.play();
            if (p && typeof p.catch === 'function') {
              p.catch(() => {});
            }
          }
        } catch (e) {}
      }

      // Cache asset URLs from host lib if available
      function cacheAllAssetUrls() {
        try {
          if (window.lib && typeof window.lib.getAsset === 'function') {
            const ids = [
              'takbir_icon',
              'qiyam_icon',
              'ruku_icon',
              'itidal_icon',
              'sujud_icon',
              'jalsa_icon',
              'sujud2_icon',
              'background_pattern',
              'success_chime',
              'error_buzz',
              'victory_music',
            ];
            ids.forEach((id) => {
              const a = window.lib.getAsset(id);
              if (a && a.url) {
                CACHED_ASSET_URLS[id] = a.url;
              }
            });
          }
        } catch (e) {}
      }

      // In Astrocade this retrieves an asset from the asset map.
      // Outside Astrocade, it checks CACHED_ASSET_URLS before falling back.
      function getAssetInfo(id) {
        try {
          if (window.lib && typeof window.lib.getAsset === 'function') {
            const asset = window.lib.getAsset(id);
            if (asset && asset.url) {
              CACHED_ASSET_URLS[id] = asset.url;
              return asset;
            }
          }
        } catch (e) {}
        if (CACHED_ASSET_URLS && CACHED_ASSET_URLS[id]) {
          return { url: CACHED_ASSET_URLS[id] };
        }
        return null;
      }
      async function preloadAudioAssets(assetIds) {
        for (const id of assetIds) {
          if (audioBuffers.has(id)) continue;
          const asset = getAssetInfo(id);
          if (!asset || !asset.url) continue;
          try {
            const ctx = getAudioContext();
            if (!ctx) continue;
            const res = await fetch(asset.url);
            const arrayBuf = await res.arrayBuffer();
            const decoded = await ctx.decodeAudioData(arrayBuf);
            audioBuffers.set(id, decoded);
          } catch (e) {
            // Synthesizer will gracefully back up audio playback
          }
        }
      }

      function playSfx(id) {
        const config = window.gameConfig || {};
        const vol = typeof config.sfxVolume === 'number' ? config.sfxVolume : 0.8;
        if (vol <= 0) return;

        if (id === 'success_chime' || id === 'error_buzz') {
          playHtmlAudio(id, vol);
        }

        const ctx = getAudioContext();
        if (!ctx) return;
        if (ctx.state === 'suspended') {
          ctx.resume().then(() => {
            executePlaySfx(ctx, id);
          }).catch(() => {});
        } else {
          executePlaySfx(ctx, id);
        }
      }

      function executePlaySfx(ctx, id) {
        const config = window.gameConfig || {};
        const vol = typeof config.sfxVolume === 'number' ? config.sfxVolume : 0.8;
        if (vol <= 0) return;

        if (audioBuffers.has(id)) {
          try {
            const source = ctx.createBufferSource();
            const gain = ctx.createGain();
            gain.gain.value = vol;
            source.buffer = audioBuffers.get(id);
            source.connect(gain);
            gain.connect(ctx.destination);
            source.start(0);
            return;
          } catch (e) {}
        }

        // Synthesized sound effects fallback
        try {
          const now = ctx.currentTime;
          const masterGain = ctx.createGain();
          masterGain.gain.value = vol;
          masterGain.connect(ctx.destination);

          if (id === 'card_snap') {
            // Gentle tactile snap click
            const osc = ctx.createOscillator();
            const noteGain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(540, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.04);
            noteGain.gain.setValueAtTime(0.2, now);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(noteGain);
            noteGain.connect(masterGain);
            osc.start(now);
            osc.stop(now + 0.06);
          } else if (id === 'success_chime') {
            // Gentle Middle-Eastern bell / chime arpeggio
            const notes = [659.25, 830.61, 987.77, 1318.51];
            notes.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const noteGain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);
              noteGain.gain.setValueAtTime(0.001, now + idx * 0.08);
              noteGain.gain.exponentialRampToValueAtTime(0.26, now + idx * 0.08 + 0.03);
              noteGain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.65);
              osc.connect(noteGain);
              noteGain.connect(masterGain);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.7);
            });
          } else if (id === 'error_buzz') {
            // Gentle, non-harsh low tone
            [0, 0.13].forEach((offset) => {
              const osc = ctx.createOscillator();
              const noteGain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(220, now + offset);
              noteGain.gain.setValueAtTime(0.001, now + offset);
              noteGain.gain.linearRampToValueAtTime(0.25, now + offset + 0.02);
              noteGain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.18);
              osc.connect(noteGain);
              noteGain.connect(masterGain);
              osc.start(now + offset);
              osc.stop(now + offset + 0.2);
            });
          }
        } catch (e) {}
      }

      const FLAG_UK = `<svg viewBox="0 0 60 30" preserveAspectRatio="none"><clipPath id="ukc"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#ukc)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#FFFFFF" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>`;

      const FLAG_MY = (() => {
        let stripes = '';
        for (let i = 0; i < 14; i += 2) {
          stripes += `<rect x="0" y="${i}" width="28" height="1" fill="#CC0001"/>`;
        }
        const pts = [];
        for (let i = 0; i < 28; i++) {
          const r = i % 2 === 0 ? 2.6 : 1.05;
          const a = -Math.PI / 2 + (i * Math.PI) / 14;
          pts.push(`${(10.4 + Math.cos(a) * r).toFixed(2)},${(4 + Math.sin(a) * r).toFixed(2)}`);
        }
        return `<svg viewBox="0 0 28 14" preserveAspectRatio="none"><rect width="28" height="14" fill="#FFFFFF"/>${stripes}<rect x="0" y="0" width="14" height="8" fill="#010066"/><circle cx="5" cy="4" r="3" fill="#FFCC00"/><circle cx="5.9" cy="4" r="2.5" fill="#010066"/><polygon points="${pts.join(' ')}" fill="#FFCC00"/></svg>`;
      })();
    </script>

                <div class="home-mode-badge">${tx('bacaanBadge')}</div>
                <div class="home-mode-title">${tx('bacaanTitle')}</div>
                <div class="home-mode-desc">${tx('bacaanDesc')}</div>
                <div class="home-mode-fact">${tx('bacaanFact')}</div>
                <button class="btn btn-accent btn-mode-start" data-action="bacaan" type="button">${tx('bacaanBtn')}</button>
              </div>
              <div class="home-mode-card dice">
                <div class="home-mode-icon">🎲</div>
                <div class="home-mode-badge">${tx('diceBadge')}</div>
                <div class="home-mode-title">${tx('diceTitle')}</div>
                <div class="home-mode-desc">${tx('diceDesc')}</div>
                <div class="home-mode-fact">${tx('diceFact')}</div>
                <button class="btn btn-dice btn-mode-start" data-action="dice" type="button">${tx('diceBtn')}</button>
              </div>
            </div>

            <div class="home-guide-box">
              <div class="home-guide-header">
                <span>${tx('guideTitle')}</span>
                
              </div>
              <div class="home-topics-pills">
                <span class="home-topic-pill">📖 ${tx('topic1')}</span>
                <span class="home-topic-pill">🕌 ${tx('topic2')}</span>
                <span class="home-topic-pill">🧭 ${tx('topic3')}</span>
                <span class="home-topic-pill">🤲 ${tx('topic4')}</span>
              </div>
            </div>

          `;

          // Butang bahasa (MS/EN) disembunyikan buat sementara. Tukar kepada true untuk papar semula.
          if (SHOW_LANG_SWITCH && typeof opts.createLangSwitch === 'function') {
            try {
              const sw = opts.createLangSwitch();
              if (sw) card.insertBefore(sw, card.firstChild);
            } catch (e) {}
          }

          card.querySelector('[data-action="bacaan"]').addEventListener('click', () => call('onStartBacaan'));
          card.querySelector('[data-action="dice"]').addEventListener('click', () => call('onStartDice'));
          card.querySelector('[data-action="puzzle"]').addEventListener('click', () => {
            close();
            call('onStartPuzzle');
          });

          overlay.appendChild(card);
          (opts.container || document.body).appendChild(overlay);
        }

        window.SolatHome = { open, close };
      })();
        </script>

    <script>

      /* ===================== BOOTSTRAP: HALAMAN UTAMA ===================== */
      // Nilai ini mestilah sepadan dengan konfigurasi permainan susunan rukun (susunan-rukun.html).
      const HOME_NUM_PILLARS = 13;
      const HOME_TOTAL_DURATION = 90;

      // Latar belakang piawai (sama seperti run() dalam permainan susunan).
      function applyWorldBackground(gameWorld) {
        const bgAsset = getAssetInfo('background_pattern');
        if (bgAsset && bgAsset.url) {
          gameWorld.style.backgroundImage = `url("${bgAsset.url}")`;
          gameWorld.style.backgroundRepeat = 'repeat';
          gameWorld.style.backgroundSize = '360px auto';
        } else {
          gameWorld.style.backgroundColor = '#F5F5DC';
          gameWorld.style.backgroundImage =
            'radial-gradient(circle at 20px 20px, rgba(45,149,150,0.13) 2px, transparent 2.5px), radial-gradient(circle at 0 0, rgba(212,175,55,0.13) 1px, transparent 1.5px)';
          gameWorld.style.backgroundSize = '40px 40px, 20px 20px';
        }
      }

      function setLanguage(code) {
        if (currentLang === code) return;
        currentLang = code;
        saveLang(code);
        try {
          document.documentElement.lang = code;
        } catch (e) {}
        playSfx('card_snap');
        renderHome();
      }

      const SHOW_LANG_SWITCH = false;

      function createLangSwitch() {
        const wrap = document.createElement('div');
        wrap.className = 'lang-switch';

        // Butang bahasa sentiasa berada di tengah.
        const langs = document.createElement('div');
        langs.style.cssText = 'display:flex;justify-content:center;flex-wrap:wrap;gap:8px;';

        [
          ['ms', 'Bahasa Melayu', FLAG_MY],
          ['en', 'English', FLAG_UK],
        ].forEach(([code, label, flag]) => {
          const a = document.createElement('a');
          a.href = '#';
          a.className = 'lang-link' + (currentLang === code ? ' active' : '');
          a.innerHTML = `<span class="lang-flag">${flag}</span><span>${label}</span>`;
          a.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            setLanguage(code);
          });
          langs.appendChild(a);
        });

        wrap.style.justifyContent = 'center';
        wrap.appendChild(langs);
        return wrap;
      }

      function renderHome() {
        const gameWorld = document.getElementById('game-world');
        gameWorld.innerHTML = '';

        const patternOverlay = document.createElement('div');
        patternOverlay.className = 'pattern-overlay';
        gameWorld.appendChild(patternOverlay);

        window.SolatHome.open({
          container: gameWorld,
          getLang: () => currentLang,
          numPostures: HOME_NUM_PILLARS,
          totalDuration: HOME_TOTAL_DURATION,
          createLangSwitch: () => createLangSwitch(),
          onStartDice: () => {
            unlockAudio();
            playSfx('card_snap');
            window.location.href = 'game-kuiz.html';
          },
          onStartBacaan: () => {
            unlockAudio();
            playSfx('card_snap');
            window.location.href = 'game-bacaan.html';
          },
          onStartPuzzle: () => {
            unlockAudio();
            playSfx('success_chime');
            window.location.href = 'game-susun.html';
          },
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        applyWorldBackground(document.getElementById('game-world'));
        renderHome();
      });
    </script>
  </body>
</html>
