            const bytes = certPdfBytes(pages);
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, certFileName('pdf'));
            setTimeout(() => URL.revokeObjectURL(url), 120000);

        function evaluateAnswers() {
          let correctCount = 0;
          const results = [];

          for (let i = 0; i < numPostures; i++) {
            const placedId = slots[i];
            if (!placedId) {
              results.push(null);
              slotFeedback[i] = null;
              continue;
            }

            const targetId = CORRECT_SEQUENCE[i];
            let isMatch = placedId === targetId;

            if (isMatch) correctCount++;
            results.push(isMatch);
            slotFeedback[i] = isMatch ? 'correct' : 'wrong';
          }

          const evalObj = {
            total: numPostures,
            placed: slots.filter(Boolean).length,
            correct: correctCount,
            results,
          };
          lastCheckResult = evalObj;
          return evalObj;
        }

        function showQuickHint() {
          if (gameState !== 'playing') return;

          const nextIndex = slots.findIndex((postureId) => !postureId);
          if (nextIndex === -1) {
            quickHint = {
              index: null,
              category: 'Info',
              text: t('allPlacedHint', { n: numPostures }),
            };
          } else {
            const targetPosture = getPosture(CORRECT_SEQUENCE[nextIndex]);
            if (targetPosture) {
              const hintsList = targetPosture.hints || [targetPosture.desc];
              // Pilih pembayang dinamik bagi rukun ini
              const chosenHint =
                hintsList[Math.floor(Math.random() * hintsList.length)] || targetPosture.desc;
              quickHint = {
                index: nextIndex,
                category: targetPosture.name,
                text: chosenHint,
              };
            } else {
              quickHint = {
                index: nextIndex,
                category: t('guide'),
                text: t('guideText'),
              };
            }
          }

          if (activeHintTimeout) clearTimeout(activeHintTimeout);
          activeHintTimeout = setTimeout(() => {
            quickHint = null;
            activeHintTimeout = null;
            if (gameState === 'playing') render();
          }, 5000);
          render();
          revealTopNotificationOnPhone();
        }

        function handleCheckAnswers() {
          if (gameState !== 'playing') {
            if (gameState === 'ready') {
              startGame();
            }
            return;
          }

          const placedCount = slots.filter(Boolean).length;
          if (placedCount < numPostures) {
            lastCheckResult = {
              incomplete: true,
              placed: placedCount,
              total: numPostures,
              correct: 0,
              results: new Array(numPostures).fill(null),
            };
            playSfx('card_snap');
            render();
            revealTopNotificationOnPhone();
            return;
          }

          // Semua petak telah diisi: permainan dikira selesai berdasarkan keputusan semasa.
          const res = evaluateAnswers();
          if (activeTimerInterval) {
            clearInterval(activeTimerInterval);
            activeTimerInterval = null;
          }
          recordResult();
          gameState = 'victory';
          render();
          if (res.correct === numPostures) {
            playMusic('victory_music');
            triggerVictoryParticles();
          } else {
            playSfx('success_chime');
          }
        }

        // Drag Preview Handling
        let previewEl = null;

        function createPreview(postureId, x, y) {
          removePreview();
          const p = getPosture(postureId);

          previewEl = document.createElement('div');
          previewEl.className = 'posture-icon bacaan-card drag-preview';
          previewEl.style.left = x + 'px';
          previewEl.style.top = y + 'px';
          previewEl.innerHTML = `<div class="bc-text"><span class="bc-ar${arLongClass(p.arabic)}">${p.arabic}</span></div>`;

          document.body.appendChild(previewEl);
        }

        function movePreview(x, y) {
          if (previewEl) {
            previewEl.style.left = x + 'px';
            previewEl.style.top = y + 'px';
          }
        }

        function removePreview() {
          if (previewEl) {
            previewEl.remove();
            previewEl = null;
          }
        }

        function cancelSelection() {
          selectedPostureId = null;
          selectedSource = null;
          selectedSlotIndex = null;
          render();
        }

        function handleTapSelect(postureId, source, sourceIndex, isTouch = false) {
          if (gameState !== 'playing') return;

          const isMobile = isNonComputerDevice() || isTouch;

          // Padanan bacaan: pada telefon, ketik bacaan dahulu, kemudian ketik gambar rukun yang sesuai.

          // Pada peranti selain komputer, mengetik kad di dalam slot akan memulangkannya ke tray
          if (isMobile && source === 'slot') {
            handleDropToTray(sourceIndex);
            return;
          }

          // Untuk komputer (desktop/laptop dengan tetikus), kekalkan ciri klik pilih & letak (tap-to-place / drag):
          if (
            selectedPostureId === postureId &&
            selectedSource === source &&
            selectedSlotIndex === sourceIndex
          ) {
            cancelSelection();
            return;
          }

          // If a card was already selected and user taps a filled slot:
          if (selectedPostureId && source === 'slot') {
            dragState = {
              postureId: selectedPostureId,
              source: selectedSource,
              sourceIndex: selectedSlotIndex,
            };
            handleDrop(sourceIndex);
            cancelSelection();
            return;
          }

          // Otherwise, select this posture
          selectedPostureId = postureId;
          selectedSource = source;
          selectedSlotIndex = sourceIndex;
          playSfx('card_snap');
          // Bunyi bacaan MP3 apabila kad jawapan ditekan
          playBacaanAudio(postureId, null);
          render();
        }

        function handleEmptySlotTap(slotIndex) {
          if (gameState !== 'playing') return;

          if (selectedPostureId) {
            dragState = {
              postureId: selectedPostureId,
              source: selectedSource,
              sourceIndex: selectedSlotIndex,
            };
            handleDrop(slotIndex);
            cancelSelection();
          }
        }

        function setupDragSource(el, postureId, source, sourceIndex) {
          let startX = 0,
            startY = 0,
            isDragging = false,
            touchHoldTimer = null,
            touchGestureCancelled = false,
            lastTouchX = 0,
            lastTouchY = 0,
            hasMoved = false;

          function clearTouchHoldTimer() {
            if (touchHoldTimer) {
              clearTimeout(touchHoldTimer);
              touchHoldTimer = null;
            }
          }

          function onStart(cx, cy) {
            if (gameState !== 'playing') return;
            startX = cx;
            startY = cy;
            lastTouchX = cx;
            lastTouchY = cy;
            isDragging = false;
            hasMoved = false;
          }

          function beginDrag(cx, cy, e) {
            if (isDragging || gameState !== 'playing') return;
            isDragging = true;
            dragState = { postureId, source, sourceIndex };
            el.classList.add('dragging');
            createPreview(postureId, cx, cy);
            if (e && e.cancelable) e.preventDefault();
          }

          function onMove(cx, cy, e) {
            if (gameState !== 'playing') return;
            const dx = cx - startX,
              dy = cy - startY;
            if (!isDragging && dx * dx + dy * dy > 64) {
              beginDrag(cx, cy, e);
            }
            if (isDragging) {
              if (e && e.cancelable) e.preventDefault();
              movePreview(cx, cy);
              updateSlotHighlights(cx, cy);
            }
          }

          function onEnd(cx, cy) {
            clearTouchHoldTimer();
            if (isDragging) {
              const targetSlotIndex = findSlotAt(cx, cy);
              if (targetSlotIndex !== null) {
                handleDrop(targetSlotIndex);
              } else if (source === 'slot') {
                const trayEl = gameWorld.querySelector('.tray-area');
                if (trayEl) {
                  const trayRect = trayEl.getBoundingClientRect();
                  if (
                    cx >= trayRect.left &&
                    cx <= trayRect.right &&
                    cy >= trayRect.top &&
                    cy <= trayRect.bottom
                  ) {
                    handleDropToTray(sourceIndex);
                  }
                }
              }
              el.classList.remove('dragging');
              clearSlotHighlights();
              removePreview();
              dragState = null;
            }
            isDragging = false;
            touchGestureCancelled = false;
          }

          // Touch support: pure tap selects/places; swiping scrolls smoothly; intentional hold (350ms) starts drag.
          el.addEventListener(
            'touchstart',
            (e) => {
              if (gameState !== 'playing') return;
              const t = e.touches[0];
              onStart(t.clientX, t.clientY);
              touchGestureCancelled = false;
              clearTouchHoldTimer();
              touchHoldTimer = setTimeout(() => {
                touchHoldTimer = null;
                if (!touchGestureCancelled && !hasMoved && gameState === 'playing') {
                  beginDrag(lastTouchX, lastTouchY, null);
                }
              }, 350);
            },
            { passive: true }
          );

          el.addEventListener(
            'touchmove',
            (e) => {
              const t = e.touches[0];
              lastTouchX = t.clientX;
              lastTouchY = t.clientY;

              if (!isDragging) {
                const dx = lastTouchX - startX;
                const dy = lastTouchY - startY;
                // Movement > 6px is a scroll gesture -> cancel drag hold timer and do not block scroll!
                if (dx * dx + dy * dy > 36) {
                  hasMoved = true;
                  touchGestureCancelled = true;
                  clearTouchHoldTimer();
                }
                return; // Let native vertical scroll proceed!
              }

              if (e.cancelable) e.preventDefault();
              movePreview(lastTouchX, lastTouchY);
              updateSlotHighlights(lastTouchX, lastTouchY);
            },
            { passive: false }
          );

          el.addEventListener('touchend', (e) => {
            clearTouchHoldTimer();
            const t = e.changedTouches[0];
            const dx = t.clientX - startX;
            const dy = t.clientY - startY;

            if (isDragging) {
              onEnd(t.clientX, t.clientY);
            } else if (!hasMoved && dx * dx + dy * dy <= 36) {
              // Clean tap without scroll movement
              lastTouchTapTime = Date.now();
              handleTapSelect(postureId, source, sourceIndex, true);
            }
            isDragging = false;
            touchGestureCancelled = false;
            hasMoved = false;
          });

          el.addEventListener('touchcancel', () => {
            clearTouchHoldTimer();
            touchGestureCancelled = true;
            if (isDragging) {
              el.classList.remove('dragging');
              clearSlotHighlights();
              removePreview();
              dragState = null;
              isDragging = false;
            }
          });

          // Mouse support keeps immediate drag & drop + click to select on computers
          let mouseMoved = false;
          el.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (Date.now() - lastTouchTapTime < 600) return;
            onStart(e.clientX, e.clientY);
            mouseMoved = false;

            const mousemove = (e2) => {
              const dx = e2.clientX - startX;
              const dy = e2.clientY - startY;
              if (dx * dx + dy * dy > 9) {
                mouseMoved = true;
              }
              onMove(e2.clientX, e2.clientY, e2);
            };
            const mouseup = (e2) => {
              window.removeEventListener('mousemove', mousemove);
              window.removeEventListener('mouseup', mouseup);
              if (isDragging) {
                onEnd(e2.clientX, e2.clientY);
              } else if (!mouseMoved) {
                handleTapSelect(postureId, source, sourceIndex, false);
              }
            };
            window.addEventListener('mousemove', mousemove);
            window.addEventListener('mouseup', mouseup);
          });
        }

        function findSlotAt(cx, cy) {
          const slotEls = gameWorld.querySelectorAll('.slot');
          for (let i = 0; i < slotEls.length; i++) {
            const rect = slotEls[i].getBoundingClientRect();
            if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) {
              return parseInt(slotEls[i].dataset.index);
            }
          }
          return null;
        }

        function updateSlotHighlights(cx, cy) {
          const slotEls = gameWorld.querySelectorAll('.slot');
          slotEls.forEach((el) => {
            const rect = el.getBoundingClientRect();
            if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) {
              el.classList.add('drag-over');
            } else {
              el.classList.remove('drag-over');
            }
          });
        }

        function clearSlotHighlights() {
          gameWorld.querySelectorAll('.slot').forEach((el) => el.classList.remove('drag-over'));
        }

        function handleDropToTray(slotIndex) {
          const postureId = slots[slotIndex];
          if (!postureId) return;
          slots[slotIndex] = null;
          slotFeedback[slotIndex] = null;
          lastCheckResult = null;
          selectedPostureId = null;
          selectedSource = null;
          selectedSlotIndex = null;
          if (!trayItems.includes(postureId)) {
            trayItems.push(postureId);
          }
          playSfx('card_snap');
          render();
        }

        function handleDrop(targetIndex) {
          if (!dragState) return;

          const { postureId, source, sourceIndex } = dragState;
          const existingInTarget = slots[targetIndex];

          // Reset previous check evaluation and any temporary clue on modification
          lastCheckResult = null;
          quickHint = null;
          selectedPostureId = null;
          selectedSource = null;
          selectedSlotIndex = null;
          if (activeHintTimeout) {
            clearTimeout(activeHintTimeout);
            activeHintTimeout = null;
          }
          slotFeedback = new Array(numPostures).fill(null);

          if (source === 'tray') {
            trayItems = trayItems.filter((id) => id !== postureId);
            if (existingInTarget) {
              trayItems.push(existingInTarget);
            }
            slots[targetIndex] = postureId;
          } else if (source === 'slot') {
            slots[sourceIndex] = existingInTarget;
            slots[targetIndex] = postureId;
          }

          recentSnappedIndex = targetIndex;
          playSfx('card_snap');
          render();
        }

        // Creator settings are only shown inside Astrocade. The standalone edition
        // deliberately has no host dependency and uses the defaults below.
        if (window.lib && typeof window.lib.showGameParameters === 'function') {
          window.lib.showGameParameters({
            name: 'Tetapan Solat',
            params: {
              'Tempoh Masa (Saat)': {
                key: 'timerDuration',
                type: 'slider',
                min: 20,
                max: 120,
                step: 5,
                onChange: (val) => {
                  window.gameConfig.timerDuration = val;
                  init();
                },
              },
              'Bilangan Rukun': {
                key: 'numPostures',
                type: 'slider',
                min: 3,
                max: 13,
                step: 1,
                onChange: (val) => {
                  window.gameConfig.numPostures = val;
                  init();
                },
              },
              'Kelantangan SFX': {
                key: 'sfxVolume',
                type: 'slider',
                min: 0,
                max: 1,
                step: 0.05,
                onChange: (val) => {
                  window.gameConfig.sfxVolume = val;
                },
              },
              'Kelantangan Muzik': {
                key: 'musicVolume',
                type: 'slider',
                min: 0,
                max: 1,
                step: 0.05,
                onChange: (val) => {
                  window.gameConfig.musicVolume = val;
                },
              },
              'Tunjuk Pembayang (Hints)': {
                key: 'showHints',
                type: 'checkbox',
                onChange: (val) => {
                  window.gameConfig.showHints = val;
                  render();
                },
              },
            },
          });
        }

        // Sesi berkumpulan: skrin nama pemain dipaparkan dahulu; pemasa bermula selepas "Mula Bermain".
        // Jika datang dari "Cabaran Seterusnya" di game susunan, terus mula.
        init();
        if (consumeAutoStart()) {
          lastEntry = null;
          entrySaved = false;
          startGame();
        }
      }

      // Astrocade calls run(mode) itself. When this file is opened directly from a folder,
      // create the default configuration and start the playable standalone edition.
      window.run = run;
      window.addEventListener('DOMContentLoaded', () => {
        if (!window.lib) {
          window.gameConfig = window.gameConfig || {
            numPostures: 13,
            timerDuration: 60,
            showHints: true,
            sfxVolume: 0.8,
            musicVolume: 0.7,
          };
          run('play');
        }
      });
    </script>
  </body>
</html>
