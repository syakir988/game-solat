<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuiz Dadu Solat</title>
    <style>
      :root {
        --primary: #2D9596; --primary-dark: #1F6B6C; --blue: #1B64C8; --blue-dark: #0F4FA8;
        --yellow: #FFD93B; --yellow-dark: #F2B705; --cream: #FFF8E6; --ink: #232B2B; --muted: #4B5A5A;
        --display: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        --p0: #1B64C8; --p1: #D32F2F; --p2: #2E9E4A; --p3: #7A3FD6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); }
      body { background: #8FD3F4; }
      #game-world {
        min-height: 100vh;
        background-color: #8FD3F4;
        background-image: linear-gradient(180deg, #8FD3F4 0%, #CFEFFF 45%, #9BDB6E 100%);
        background-size: cover; background-position: center bottom; background-repeat: no-repeat; background-attachment: fixed;
      }
      .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 10px 12px 28px; }
      button { font-family: inherit; }

      /* ---------- Header ---------- */
      .head { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
      .home {
        display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff;
        background: linear-gradient(160deg, #A56BF0, #7A3FD6); box-shadow: 0 5px 0 #5B2AAE, 0 8px 16px rgba(60,20,120,.35);
        color: #fff; text-decoration: none; transition: transform .15s;
      }
      .home svg { width: 27px; height: 27px; }
      .home:hover { transform: translateY(-2px) scale(1.05); } .home:active { transform: translateY(3px); }
      .title-wrap { display: flex; flex-direction: column; align-items: center; min-width: 0; }
      .title { margin: 0; display: flex; flex-direction: column; align-items: center; font-family: var(--display); font-weight: 900; line-height: .95;
        -webkit-text-stroke: 7px var(--blue); paint-order: stroke fill; text-shadow: 0 4px 0 var(--blue-dark); }
      .title .a { font-size: clamp(24px, 3.4vw, 42px); color: var(--yellow); } .title .b { font-size: clamp(28px, 4.2vw, 52px); color: #fff; }
      .ribbon { margin: 6px 0 0; padding: 4px 18px; border-radius: 8px; background: linear-gradient(180deg,#FFF3B0,#FFE680); border: 2px solid #F2D14B;
        color: #14306B; font-family: var(--display); font-size: 14px; font-weight: 700; text-align: center; }
      .stats { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 24px; background: linear-gradient(180deg,#fff,#DDF1FF);
        border: 3px solid #fff; box-shadow: 0 5px 14px rgba(20,70,140,.25); }
      .pill { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 13px; border-radius: 19px; white-space: nowrap;
        background: linear-gradient(180deg,#2A78DD,#0F4FA8); border: 2px solid #7DB8FF; color: #fff; font-family: var(--display); font-size: 15px; font-weight: 700; }
      .pill.gold { background: linear-gradient(180deg,#FFE27A,#FFC01F); border: 3px solid #F59E0B; color: #6B3A00; }
      .iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #BFDDF8; background: #fff; font-size: 17px; cursor: pointer; }

      /* ---------- Susun atur ---------- */
      .layout { display: grid; gap: 14px; margin-top: 12px; align-items: start; }
      @media (min-width: 940px) { .layout { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); } }
      .board-card { padding: 12px; border-radius: 28px; background: linear-gradient(180deg,#FFFDF2,#FFF4D0); border: 4px solid #FFEBA8;
        box-shadow: 0 10px 24px rgba(60,90,30,.22), inset 0 0 0 3px rgba(255,255,255,.7); }
      .board { position: relative; width: 100%; max-width: 700px; margin: 0 auto; aspect-ratio: 6 / 5; border-radius: 18px; overflow: hidden; border: 3px solid #E6D49A; background: #fff; }
      .cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr); }
      .sq { position: relative; display: flex; align-items: flex-start; justify-content: flex-start; padding: 4px 6px; border: 1px solid rgba(0,0,0,.06);
        font-family: var(--display); font-weight: 900; font-size: clamp(11px, 1.8vw, 18px); color: rgba(20,48,107,.8); }
      .sq:nth-child(odd) { background: #FFF6D6; } .sq:nth-child(even) { background: #E6F4FF; }
      .sq.ladder-start { background: #DDF6D9 !important; } .sq.snake-start { background: #FFE0E0 !important; }
      .sq.star { background: #FFF1A8 !important; } .sq.finish { background: linear-gradient(135deg,#FFE27A,#FFB81F) !important; }
      .sq.first { background: #D8F1EE !important; }
      .sq small { position: absolute; right: 5px; bottom: 3px; font-size: clamp(12px, 2vw, 20px); line-height: 1; }
      svg.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .tokens { position: absolute; inset: 0; pointer-events: none; }
      .token { position: absolute; width: 7.4%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; border: 3px solid #fff;
        color: #fff; font-family: var(--display); font-weight: 900; font-size: clamp(11px, 1.7vw, 18px); text-shadow: 0 1px 2px rgba(0,0,0,.4);
        box-shadow: 0 3px 8px rgba(0,0,0,.4); transform: translate(calc(-50% + var(--ox, 0px)), calc(-50% + var(--oy, 0px))); transition: left .22s linear, top .22s linear; z-index: 3; }
      .token.slide { transition: left .7s ease-in-out, top .7s ease-in-out; }
      .token.active { animation: bob .7s infinite alternate; z-index: 4; } @keyframes bob { to { margin-top: -6px; } }

      /* ---------- Panel kanan ---------- */
      .side { display: flex; flex-direction: column; gap: 12px; }
      .panel { padding: 12px; border-radius: 24px; background: linear-gradient(180deg,#EAF7FF,#CFEAFB); border: 4px solid #FFEBA8;
        box-shadow: 0 10px 24px rgba(20,70,140,.22), inset 0 0 0 3px rgba(255,255,255,.7); }
      .turn { padding: 9px 14px; border-radius: 16px; background: linear-gradient(180deg,#2A78DD,#0F4FA8); border: 2px solid #7DB8FF; color: #fff;
        font-family: var(--display); font-size: 15px; font-weight: 700; line-height: 1.3; }
      .dice-row { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
      .dice { width: 78px; height: 78px; flex: none; padding: 9px; border-radius: 18px; background: #fff; border: 3px solid #C62828; display: grid;
        grid-template: repeat(3,1fr) / repeat(3,1fr); box-shadow: 0 5px 0 #0E3F8F, 0 8px 14px rgba(0,0,0,.25); }
      .dice.roll { animation: shake .18s infinite alternate; } @keyframes shake { from { transform: rotate(-9deg) translateY(-2px); } to { transform: rotate(9deg) translateY(2px); } }
      .pip { width: 100%; height: 100%; border-radius: 50%; } .pip.on { background: #C62828; transform: scale(.78); }
      .plist { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
      .prow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 14px; background: #fff; border: 3px solid #E6EEF5; }
      .prow.on { border-color: var(--yellow-dark); background: #FFF9D6; box-shadow: 0 0 0 3px rgba(242,183,5,.25); }
      .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
      .pname { font-family: var(--display); font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pname small { display: block; font-family: "Segoe UI", Arial; font-weight: 400; font-size: 11px; color: var(--muted); }
      .pscore { text-align: right; font-size: 12px; color: var(--muted); } .pscore b { display: block; font-size: 15px; color: #B45309; font-family: var(--display); }
      .mascot { display: flex; align-items: flex-end; gap: 8px; }
      .mascot img { height: 110px; width: auto; filter: drop-shadow(0 6px 8px rgba(0,0,0,.28)); }
      .bubble { position: relative; margin-bottom: 34px; padding: 9px 14px; border-radius: 20px; background: linear-gradient(180deg,#2BB3D8,#1488B0); border: 3px solid #fff;
        box-shadow: 0 5px 12px rgba(0,0,0,.25); color: #fff; font-family: var(--display); font-size: 13px; font-weight: 700; line-height: 1.3; }
      .bubble::before { content: ""; position: absolute; left: -12px; bottom: 12px; border: 8px solid transparent; border-right: 12px solid #fff; }
      .toast { position: fixed; left: 50%; bottom: 22px; z-index: 3000; max-width: min(92vw, 460px); padding: 10px 18px; border-radius: 16px; transform: translate(-50%, 14px);
        background: #14306B; border: 2px solid var(--yellow); color: #fff; font-family: var(--display); font-size: 14px; font-weight: 700; text-align: center;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---------- Butang ---------- */
      .btn { min-width: 150px; padding: 12px 20px; border-radius: 22px; border: 3px solid #fff; font-family: var(--display); font-size: 16px; font-weight: 900; cursor: pointer;
        box-shadow: 0 5px 0 rgba(0,0,0,.22), 0 9px 16px rgba(0,0,0,.18); transition: transform .12s, filter .12s; }
      .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); } .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
      .btn:disabled { opacity: .55; cursor: not-allowed; filter: grayscale(.3); }
      .btn.green { background: linear-gradient(180deg,#4BD36F,#1E9446); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
      .btn.gold { background: linear-gradient(180deg,#FFE27A,#FFB81F); color: #6B3A00; }
      .btn.white { background: linear-gradient(180deg,#fff,#DDF1FF); color: var(--blue-dark); border-color: #9CCBF5; }
      .btn.red { background: linear-gradient(180deg,#FF8A8A,#D32F2F); color: #fff; }
      .btn.big { width: 100%; padding: 15px 20px; font-size: 18px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .btn.small { min-width: 0; padding: 8px 12px; font-size: 13px; }

      /* ---------- Modal ---------- */
      .overlay { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(14,63,143,.55); backdrop-filter: blur(5px); animation: fade .2s; }
      @keyframes fade { from { opacity: 0; } }
      .dlg { width: min(560px, 100%); max-height: 94vh; overflow-y: auto; padding: 20px 20px 18px; border-radius: 28px; text-align: center;
        background: linear-gradient(180deg,#fff,#FFF8E6); border: 5px solid var(--yellow); box-shadow: 0 16px 44px rgba(14,63,143,.45); }
      .dlg h2 { margin: 6px 0 4px; font-family: var(--display); font-size: 26px; color: var(--blue-dark); }
      .dlg p { margin: 4px 0 10px; color: #444; line-height: 1.5; }
      .dlg .emoji { font-size: 54px; line-height: 1; }
      .levels { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 10px 0; }
      .lvl { padding: 10px 6px; border-radius: 16px; border: 3px solid #BFDDF8; background: #fff; cursor: pointer; font-family: var(--display); color: var(--blue-dark); }
      .lvl .e { font-size: 28px; display: block; } .lvl b { display: block; font-size: 15px; } .lvl small { display: block; margin-top: 2px; font-family: "Segoe UI", Arial; font-size: 11px; color: var(--muted); }
      .lvl.on { border-color: var(--blue); background: #EAF4FF; box-shadow: 0 0 0 4px rgba(27,100,200,.2); }
      .prow-in { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; margin: 6px 0; }
      .prow-in input { width: 100%; min-width: 0; padding: 10px 11px; border-radius: 12px; border: 3px solid #BFDDF8; background: #fff; font-size: 15px; font-family: var(--display); outline: none; }
      .prow-in input:focus { border-color: var(--blue); } .prow-in input.bad { border-color: #D32F2F; box-shadow: 0 0 0 3px rgba(211,47,47,.15); }
      .err { margin: 6px 0; padding: 7px 10px; border-radius: 12px; background: #FFE9E9; border: 2px solid #E86A6A; color: #A31515; font-size: 13px; font-weight: 700; text-align: left; }
      .err[hidden] { display: none; }
      .note { font-size: 12px; color: var(--muted); }

      /* ---------- Soalan ---------- */
      .qdlg { text-align: left; }
      .qtop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .qchip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 4px 5px; border-radius: 999px; background: #fff; border: 2px solid #BFDDF8; font-family: var(--display); font-weight: 700; font-size: 14px; }
      .qchip .dot { width: 22px; height: 22px; }
      .qdice { margin-left: auto; padding: 4px 12px; border-radius: 999px; background: #FFF3B0; border: 2px solid #F2D14B; color: #6B4A00; font-family: var(--display); font-weight: 700; font-size: 13px; }
      .tbar { height: 12px; margin: 10px 0; border-radius: 6px; overflow: hidden; background: #DDE8F3; }
      .tbar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#4BD36F,#FFD93B); transform-origin: left; }
      .tbar.low i { background: linear-gradient(90deg,#FF8A8A,#D32F2F); }
      .qtext { margin: 6px 0 12px; font-family: var(--display); font-size: 20px; line-height: 1.35; color: #14306B; }
      .opts { display: grid; gap: 9px; }
      .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border-radius: 16px; border: 3px solid #BFDDF8; background: #fff; text-align: left; cursor: pointer;
        font-family: var(--display); font-size: 16px; color: #1c2d4a; transition: transform .1s, border-color .1s; }
      .opt:hover:not(:disabled) { transform: translateX(3px); border-color: var(--blue); }
      .opt .k { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(180deg,#2A78DD,#0F4FA8); color: #fff; font-weight: 900; font-size: 14px; }
      .opt.ok { border-color: #2E9E4A; background: #E3F7E7; } .opt.ok .k { background: #2E9E4A; }
      .opt.no { border-color: #D32F2F; background: #FFE9E9; } .opt.no .k { background: #D32F2F; }
      .opt:disabled { cursor: default; }
      .fb { margin-top: 12px; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
      .fb.ok { background: #E3F7E7; border: 2px solid #2E9E4A; color: #17602B; } .fb.no { background: #FFF1E0; border: 2px solid #F59E0B; color: #7A4A00; }
      .fb b.t { display: block; font-family: var(--display); font-size: 17px; margin-bottom: 2px; }
      body.lvl-cilik .qtext { font-size: 25px; } body.lvl-cilik .opt { font-size: 19px; padding: 14px 14px; } body.lvl-cilik .opt .k { width: 36px; height: 36px; font-size: 17px; }

      /* ---------- Keputusan & papan kedudukan ---------- */
      .rtable, .lb-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 14px; color: var(--ink); text-align: left; }
      .rtable th, .lb-table th { padding: 2px 8px; font-size: 12px; color: #6B5B2A; }
      .rtable td, .lb-table td { padding: 8px; background: #fff; border-top: 2px solid #E6EEF5; border-bottom: 2px solid #E6EEF5; }
      .rtable td:first-child, .lb-table td:first-child { border-left: 2px solid #E6EEF5; border-radius: 12px 0 0 12px; }
      .rtable td:last-child, .lb-table td:last-child { border-right: 2px solid #E6EEF5; border-radius: 0 12px 12px 0; }
      .rtable tr.first td, .lb-row-me td { background: #FFF3B0; border-color: #F2D14B; }
      .lb { z-index: 2100; } .lbcard { width: min(600px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; padding: 0; }
      .lbcard h2 { margin: 12px 0 2px; } .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; padding: 6px 12px; }
      .tab { padding: 6px 14px; border-radius: 999px; border: 2px solid #BFDDF8; background: #fff; color: var(--blue-dark); font-family: var(--display); font-size: 14px; font-weight: 700; cursor: pointer; }
      .tab.on { background: linear-gradient(180deg,#2A78DD,#0F4FA8); border-color: var(--blue-dark); color: #fff; }
      .lbbody { overflow: auto; padding: 0 14px 4px; } .lb-empty { margin: 22px 8px; text-align: center; color: var(--muted); }
      .lb-rank { width: 44px; font-weight: 900; font-size: 16px; white-space: nowrap; } .lb-name { font-weight: 700; } .lb-name small { display: block; font-weight: 400; font-size: 11px; color: #6B7A7A; }
      .lbfoot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px 14px 14px; }
      .sortrow { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
      .confetti { position: fixed; top: -20px; z-index: 2500; font-size: 22px; pointer-events: none; animation: fall linear forwards; }
      @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

      @media (max-width: 760px) {
        .head { grid-template-columns: auto 1fr; } .stats { grid-column: 1 / -1; justify-content: center; flex-wrap: wrap; }
        .home { width: 46px; height: 46px; } .mascot img { height: 84px; }
        .levels { grid-template-columns: 1fr; } .lvl { display: grid; grid-template-columns: auto 1fr; text-align: left; align-items: center; gap: 4px 10px; } .lvl .e { grid-row: 1 / 3; }
        .prow-in { grid-template-columns: auto 1fr auto; }
        .row2 { grid-template-columns: 1fr; } .dlg { padding: 16px 14px; }
      }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    </style>
  </head>
  <body>
    <div id="game-world"><div id="app"></div></div>
    <script>
      /* ===================== KUIZ DADU SOLAT ===================== */
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
      const fmt = (n) => String(n);

      const HOME_URL = 'index.html';
      const IMG_DIR = 'imej-kartun/';
      const IMG = {
        bg: { local: IMG_DIR + 'latar.webp', },
        mascot: { local: IMG_DIR + 'maskot.webp', },
      };

      const MAX_ROUNDS = 15;
      const BONUS = [50, 30, 20, 10];
      const COLORS = ['#1B64C8', '#D32F2F', '#2E9E4A', '#7A3FD6'];
      const OFFSETS = [[-9, -8], [9, -8], [-9, 9], [9, 9]];
      const LEVELS = {
        cilik: { name: 'Aras Rendah', emoji: '🌱', who: 'Tempoh masa', desc: 'Aras Rendah ialah tahap permulaan. Soalan asas tentang bilangan solat fardu dan rakaat, dengan masa 45 saat.', timer: 45, ladders: { 3: 12, 8: 19, 14: 25, 17: 26 }, snakes: { 16: 6, 28: 20 }, stars: [5, 10, 22] },
        pelajar: { name: 'Asas Sederhana', emoji: '🌿', who: 'Tempoh masa', desc: 'Asas Sederhana ialah tahap pertengahan. Soalan tentang rukun solat, sujud dan bacaan asas, dengan masa 25 saat.', timer: 25, ladders: { 3: 12, 8: 19, 17: 26 }, snakes: { 16: 6, 24: 14, 28: 20 }, stars: [7, 15, 23] },
        mahir: { name: 'Asas Tinggi', emoji: '🌳', who: 'Tempoh masa', desc: 'Asas Tinggi ialah tahap lanjutan. Soalan lebih mendalam tentang solat qasar, jamak dan hukum solat, dengan masa 18 saat.', timer: 18, ladders: { 8: 19, 17: 26 }, snakes: { 16: 6, 22: 11, 24: 14, 28: 12 }, stars: [5, 13, 21] },
      };
      const LEVEL_KEYS = ['cilik', 'pelajar', 'mahir'];

      /* ===================== BANK SOALAN (mazhab Syafi'i, seperti diajar di Malaysia) =====================
         Format: { q: soalan, o: [pilihan A, B, C, D], a: indeks jawapan betul (0-3), e: penjelasan }
         Guru boleh menambah atau menyunting soalan di sini. Semak dengan ustaz atau ustazah sebelum digunakan. */
      const QUESTIONS = {
        cilik: [
          { q: 'Berapakah bilangan solat fardu yang wajib dilakukan sehari semalam?', o: ['3', '4', '5', '6'], a: 2, e: 'Solat fardu ada lima: Subuh, Zohor, Asar, Maghrib dan Isyak.' },
          { q: 'Solat Subuh mempunyai berapa rakaat?', o: ['2', '3', '4', '5'], a: 0, e: 'Solat Subuh 2 rakaat.' },
          { q: 'Solat Maghrib mempunyai berapa rakaat?', o: ['2', '3', '4', '5'], a: 1, e: 'Solat Maghrib 3 rakaat.' },
          { q: 'Solat Zohor mempunyai berapa rakaat?', o: ['2', '3', '4', '5'], a: 2, e: 'Solat Zohor 4 rakaat.' },
          { q: 'Solat Isyak mempunyai berapa rakaat?', o: ['2', '3', '4', '5'], a: 2, e: 'Solat Isyak 4 rakaat.' },

      function bestPerPlayer(entries) {

      function speak(text) {

        if (!$('#board')) { $('#app').innerHTML = `<div class="wrap"><div class="head"><a class="home" href="${HOME_URL}" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6 1.9 11.4a1 1 0 0 0 .66 1.76H4.5V20a1.4 1.4 0 0 0 1.4 1.4h3.7v-5.2h4.8v5.2h3.7a1.4 1.4 0 0 0 1.4-1.4v-6.84h1.94a1 1 0 0 0 .66-1.76L12 2.6Z"/></svg></a><div class="title-wrap"><h1 class="title"><span class="a">Kuiz Dadu</span><span class="b">Solat</span></h1></div><span></span></div></div>`; }
        let level = state.level; let rows = [{ n: '', g: '' }, { n: '', g: '' }];
        rows[0].g = rows[1].g = '';
        const m = modal('', 'setup');
        const draw = () => {
          m.dlg.innerHTML = `<div class="emoji">🎲</div><h2>Kuiz Dadu Solat</h2>
            <p>Pilih tahap, kemudian daftarkan 1 hingga 4 pemain. Pemain bergilir menjawab soalan pada satu peranti.</p>
            <div class="levels">${LEVEL_KEYS.map((k) => `<button class="lvl ${k === level ? 'on' : ''}" data-lv="${k}"><span class="e">${LEVELS[k].emoji}</span><b>${LEVELS[k].name}</b><small>${LEVELS[k].who} · ${LEVELS[k].timer} saat</small></button>`).join('')}</div>
            <div id="prows">${rows.map((r, i) => `<div class="prow-in"><span class="dot" style="background:${COLORS[i]}"></span><input class="nm" data-i="${i}" maxlength="20" placeholder="Nama pemain ${i + 1}" value="${esc(r.n)}" autocomplete="off">${rows.length > 1 ? `<button class="iconbtn x" data-rm="${i}" aria-label="Buang">✕</button>` : '<span></span>'}</div>`).join('')}</div>
            ${rows.length < 4 ? '<button class="btn white small" id="add">+ Tambah Pemain</button>' : ''}
            <div class="err" id="err" role="alert" hidden></div>
            <p class="note">${LEVELS[level].desc}</p>
            <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px"><a class="btn white" href="${HOME_URL}" data-home style="text-decoration:none" aria-label="Halaman Utama"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="vertical-align:-4px;margin-right:4px"><path d="M12 2.6 1.9 11.4a1 1 0 0 0 .66 1.76H4.5V20a1.4 1.4 0 0 0 1.4 1.4h3.7v-5.2h4.8v5.2h3.7a1.4 1.4 0 0 0 1.4-1.4v-6.84h1.94a1 1 0 0 0 .66-1.76L12 2.6Z"/></svg>Halaman Utama</a><button class="btn green" id="go">▶ Mula Perlumbaan</button></div>`;
          m.dlg.querySelectorAll('[data-lv]').forEach((b) => b.addEventListener('click', () => { level = b.dataset.lv; try { window.localStorage.setItem('ut-level', level); } catch (e) {} readRows();  draw(); }));
          m.dlg.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', () => { readRows(); validate(); }));
          m.dlg.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { readRows(); rows.splice(+b.dataset.rm, 1); draw(); }));
          const add = $('#add', m.dlg); if (add) add.addEventListener('click', () => { readRows(); rows.push({ n: '', g: '' }); draw(); const ins = m.dlg.querySelectorAll('.nm'); ins[ins.length - 1].focus(); });
          $('#go', m.dlg).addEventListener('click', start);
          // Bunyi klik sebelum pulang ke halaman utama
          const homeA = m.dlg.querySelector('[data-home]');
          if (homeA) homeA.addEventListener('click', (e) => { e.preventDefault(); const u = homeA.href; tone(540, 0.05, 'sine', 0.12); setTimeout(() => { window.location.href = u; }, 260); });
          m.dlg.querySelectorAll('input').forEach((inp) => inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); start(); } }));
          validate();
        };
        function readRows() { m.dlg.querySelectorAll('.nm').forEach((el) => (rows[+el.dataset.i].n = el.value)); }
        function validate() {
          const names = rows.map((r) => normName(r.n)); let msg = '';
          const bad = new Set();
          if (names.some((n) => !n)) msg = 'Sila isi nama semua pemain sebelum mula bermain.';
          rows.forEach((r, i) => {
            if (!names[i]) return;
            if (names.indexOf(names[i]) !== i) { bad.add(i); msg = msg || `Nama “${esc(r.n.trim())}” digunakan dua kali. Setiap pemain perlu nama yang berbeza.`; }
          });
          m.dlg.querySelectorAll('.nm').forEach((el) => el.classList.toggle('bad', bad.has(+el.dataset.i)));
          const err = $('#err', m.dlg); if (err) { err.hidden = !msg; err.innerHTML = msg; }
          const go = $('#go', m.dlg); if (go) go.disabled = bad.size > 0 || names.some((n) => !n);
          return bad.size === 0 && !names.some((n) => !n);
        }
        function start() {
          readRows(); if (!validate()) return;
          const d = loadLevel(level), used = new Set(rows.map((r) => normName(r.n)).filter(Boolean));
          let k = 0;
          const players = rows.map((r) => {
            let name = r.n.trim().replace(/\s+/g, ' ');
              return { name, group: '', pos: 1, points: 0, correct: 0, answered: 0, turns: 0, stars: 0 };
          });
          // pemain dengan nama kosong mendapat nama automatik yang unik
          m.close(); actx();
          state.level = level; state.players = players; state.cur = 0; state.round = 1; state.used = new Set(); state.raceId++;
          renderGame(); setPhase('idle'); markActive();
          $('#turn').textContent = `Giliran ${players[0].name}: tekan Lambung Dadu!`;
          say(`Jom bermain! Giliran ${players[0].name}.`); $('#btn-roll').focus();
        }
        draw();
        setTimeout(() => { const f = m.dlg.querySelector('.nm'); if (f) f.focus(); }, 60);
      }

      showSetup();

    </script>
  <script src="demo-gate.js"></script>
</body>
</html>
